[package]
name = "hijin"
version = "1.0.0"
description = "Hijin Native Desktop AI Workstation"
authors = ["Hijin Tech"]
edition = "2021"

[lib]
name = "hijin_lib"
crate-type = ["rlib"]

[[bin]]
name = "hijin"
path = "src/main.rs"

[[bin]]
name = "hijin_daemon"
path = "src/bin/hijin_daemon.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled-full"] }
walkdir = "2"
