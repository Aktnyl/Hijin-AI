name: Feature Request
description: Suggest an enhancement or new accounting connector for Hijin
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What challenge or workflow bottleneck does this address?
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution / Feature
      description: Describe your proposed feature or workflow integration.
    validations:
      required: true
